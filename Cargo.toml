[workspace]
resolver = "3"
members = ["api", "controller"]

[workspace.package]
# version is intentionally not shared: each crate is versioned on its own.
edition = "2024"
license = "MIT"
repository = "https://github.com/terassyi/yukari"

[workspace.dependencies]
yukari-api = { path = "api" }

k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

thiserror = "2.0.20"

rstest = "0.26.1"
