name: Set up Rust build tools
description: Install the aqua-managed tools and restore the Rust build cache

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-aqua
    # rust-toolchain.toml pins the toolchain, which rustup installs on first use
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
