# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Permissive licenses only. Every entry below is required by the current
# dependency graph; crates offering a choice resolve to one of these.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicate versions come in transitively and are not something this repo can
# fix. This restates cargo-deny's default, kept explicit so the policy does not
# change silently under a new default.
multiple-versions = "warn"
wildcards = "deny"
# The workspace uses path dependencies without a version requirement, which is
# how per-crate versions stay independent
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
