name: CI
#
# The `ci` recipe in the justfile mirrors these jobs for local runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # Renovate bumps aqua packages without touching aqua-checksums.json, and
      # aqua.yaml sets require_checksum, so a stale checksum file breaks every
      # aqua-managed tool - `just` included. This runs first, and calls aqua
      # directly rather than through `just checksum-check`, so that it can still
      # report the cause when the stale package is one of the tools CI runs.
      # `just update-checksum` is the fix.
      - run: |
          aqua update-checksum --prune
          git diff --exit-code -- aqua-checksums.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just fmt-check
      - run: just lint
      # pinact resolves version comments through the GitHub API
      - run: just lint-actions
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: just test

  codegen-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # kopium is built from source, and the aqua cache in setup-aqua keeps the
      # built binary. generate-check itself only needs cargo for fmt and metadata.
      - uses: ./.github/actions/setup-rust
      - run: just generate-check

  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny shells out to cargo metadata, so this job needs the toolchain
      - uses: ./.github/actions/setup-rust
      - run: just deny
